name: AEXA Server Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/risk-management-server:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/risk-management-server:latest
          cache-to: type=inline

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/risk-management

            sed -i '/^SESSION_SECRET=/d; /^AI_INTERNAL_SECRET=/d' .env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
            echo "AI_INTERNAL_SECRET=${{ secrets.AI_INTERNAL_SECRET }}" >> .env

            echo "Pulling latest image..."
            docker compose pull

            echo "Restarting containers..."
            docker compose up -d

            echo "Cleaning unused resources..."
            docker image prune -f
