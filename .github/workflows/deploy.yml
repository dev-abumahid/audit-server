name: AEXA Server Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN defaults to read-only on `packages` for most repos —
    # without this, the GHCR push below fails with a permissions error
    # regardless of the token being otherwise valid.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # GHCR, not Docker Hub: the image previously lived under techzaa — a
      # contractor's personal Docker Hub account, not company infrastructure.
      # GHCR rides on the Qiyrix GitHub org we already own, needs no separate
      # account/email/payment tier, and authenticates with the auto-provided
      # GITHUB_TOKEN below instead of a DOCKER_USERNAME/DOCKER_PASSWORD pair.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Matches the VPS's docker-compose.yml image name exactly (hardcoded
          # there, not templated) — must stay in sync, or `docker compose pull`
          # on the VPS keeps fetching the old image while this workflow pushes
          # to a different, unused tag.
          tags: ghcr.io/qiyrix/aexa-server:latest
          cache-from: type=registry,ref=ghcr.io/qiyrix/aexa-server:latest
          cache-to: type=inline

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/risk-management

            sed -i '/^SESSION_SECRET=/d; /^AI_INTERNAL_SECRET=/d; /^IS_GOOGLE_LOGIN=/d; /^GOOGLE_CLIENT_ID=/d; /^GOOGLE_CLIENT_SECRET=/d; /^GOOGLE_CALLBACK_URL=/d' .env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
            echo "AI_INTERNAL_SECRET=${{ secrets.AI_INTERNAL_SECRET }}" >> .env
            # IS_GOOGLE_LOGIN/GOOGLE_CALLBACK_URL aren't sensitive (the callback
            # URL is publicly visible in the OAuth redirect itself) — only the
            # client ID/secret pair is a real secret, so only those two go
            # through GitHub Actions secrets.
            echo "IS_GOOGLE_LOGIN=true" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_CALLBACK_URL=https://api.qiyrix.com/api/auth/social/google/callback" >> .env

            echo "Pulling latest image..."
            docker compose pull

            echo "Restarting containers..."
            docker compose up -d

            echo "Cleaning unused resources..."
            docker image prune -f
